function getSandFinishChecklistForFinishType(finishType, stainColor) {
  const ft = String(finishType || "").trim().toLowerCase();
  const hasStainColor = String(stainColor || "").trim().length > 0;
  if (hasStainColor) return SAND_FINISH_STAIN_CHECKLIST;
  if (ft.indexOf("stain") !== -1) return SAND_FINISH_STAIN_CHECKLIST;
  return SAND_FINISH_NATURAL_CHECKLIST;
}

function getChecklistForJob(job) {
  const jobType = job && job.jobType ? job.jobType : "installation";
  const sandChecklist = getSandFinishChecklistForFinishType(job && job.finishType, job && job.stainColor);
  if (jobType === "sandFinish") return sandChecklist;
  if (jobType === "installSandFinish") return [...INSTALL_CHECKLIST, ...sandChecklist];
  return INSTALL_CHECKLIST;
}

function getChecklistItemLabel(job, key, t) {
  if (key !== "sf_stain") return t[key];
  const color = String((job && job.stainColor) || "").trim();
  if (color) return `${t.sf_stain} (${color})`;
  return t.stainColorManual;
}

function displayOrDash(val, t) {
  const s = String(val || "").trim();
  return s ? s : t.notAvailable;
}

function buildTearSheetRows(job, t) {
  const rows = [];
  const jt = job.jobType || "installation";
  if (jt === "installation") {
    rows.push([t.installType, displayOrDash(job.installType, t)]);
    rows.push([t.finishType, displayOrDash(job.finishType, t)]);
  } else if (jt === "sandFinish") {
    rows.push([t.finishType, displayOrDash(job.finishType, t)]);
    rows.push([t.stainColor, displayOrDash(job.stainColor, t)]);
  } else if (jt === "installSandFinish") {
    rows.push([t.installType, displayOrDash(job.installType, t)]);
    rows.push([t.finishType, displayOrDash(job.finishType, t)]);
    rows.push([t.stainColor, displayOrDash(job.stainColor, t)]);
  } else {
    rows.push([t.installType, displayOrDash(job.installType, t)]);
    rows.push([t.finishType, displayOrDash(job.finishType, t)]);
    rows.push([t.stainColor, displayOrDash(job.stainColor, t)]);
  }
  rows.push([t.sqft, `${Number(job.sqft) || 0} ${t.sqft}`]);
  rows.push([t.woodSpecies, displayOrDash(job.woodSpecies, t)]);
  rows.push([t.product, displayOrDash(job.product, t)]);
  const sheetUrl = job.sheetUrl && String(job.sheetUrl).trim();
  const folderUrl = job.clientFolderUrl && String(job.clientFolderUrl).trim();
  if (sheetUrl) {
    rows.push([t.estimateSheet, (
      <a href={sheetUrl} target="_blank" rel="noreferrer" style={{ color: "var(--blue)", textDecoration: "none", fontWeight: 700 }}>
        {t.openEstimate}
      </a>
    )]);
  }
  if (folderUrl) {
    rows.push([t.clientFolder, (
      <a href={folderUrl} target="_blank" rel="noreferrer" style={{ color: "var(--blue)", textDecoration: "none", fontWeight: 700 }}>
        {t.openClientFolder}
      </a>
    )]);
  }
  return rows;
}

function buildTearSheetLinkRows(job, t) {
  const rows = [];
  const sheetUrl = job.sheetUrl && String(job.sheetUrl).trim();
  const folderUrl = job.clientFolderUrl && String(job.clientFolderUrl).trim();
  if (sheetUrl) {
    rows.push([t.estimateSheet, (

    )]);
  }
  return rows;
}

function sanitizeCheckerName(name) {
  const n = String(name || "").trim();
  if (!n) return "";
  // Guard against accidental JSON/blob values from older schema mismatch.
  if (n.charAt(0) === "[" || n.charAt(0) === "{") return "";
  if (n.indexOf('"label"') !== -1 || n.indexOf('"qty"') !== -1 || n.indexOf('"unit"') !== -1) return "";
  return n;
}

function normalizePhotoList(list) {
  if (!Array.isArray(list)) return [];
  return list
    .map((p) => {
      if (!p || typeof p !== "object") return null;
      const src = String(p.dataUrl || p.url || p.driveUrl || "").trim();
      if (!src) return null;
      return { ...p, url: p.url || p.driveUrl || p.dataUrl };
    })
    .filter(Boolean);
}

function normalizeSummaryLinesForCrew(lines) {
  const src = Array.isArray(lines) ? lines : [];
  const hasInstallSqFt = src.some(l => String(l && l.label || "").trim() === "Installation Sq Ft");
  const hasSandSqFt = src.some(l => String(l && l.label || "").trim() === "Sand & Finish Sq Ft");
  const hasTearUp = src.some(l => String(l && l.label || "").trim() === "Tear-Up");
  return src.filter((line) => {
    const label = String(line && line.label || "").trim();
    if (label === "Installation Sq Ft" && (line.qty === 0 || line.qty === null)) return false;
    if (label === "Installation" && hasInstallSqFt) return false;
    if (label === "Sand & Finish" && hasSandSqFt) return false;
    if (label === "Tear-Up Sq Ft" && hasTearUp) return false;
    return true;
  });
}

/** Rooms from API (Measurements) or fallback to comma-separated room names from roomsSummary. */
function normalizeRoomRow(r) {
  var sq = typeof r.sqft === "number" ? r.sqft : parseFloat(r.sqft);
  return {
    name: String(r.name || "").trim() || "Room",
    workType: String(r.workType || "").trim(),
    tearUp: String(r.tearUp || "None").trim() || "None",
    sqft: Number.isFinite(sq) ? sq : 0
  };
}

/** Prefer job.rooms array; else parse roomsJson string from sheet column. */
function getRoomRowsFromPayload(job) {
  if (Array.isArray(job && job.rooms) && job.rooms.length > 0) {
    return job.rooms.map(normalizeRoomRow);
  }
  var js = job && job.roomsJson;
  if (typeof js === "string" && js.trim()) {
    try {
      var parsed = JSON.parse(js);
      if (Array.isArray(parsed) && parsed.length > 0) return parsed.map(normalizeRoomRow);
    } catch (e) {}
  }
  return [];
}

function getRoomsForJob(job) {
  var fromPayload = getRoomRowsFromPayload(job);
  if (fromPayload.length > 0) return fromPayload;
  var raw = String((job && job.roomsSummary) || "").trim();
  if (!raw) return [];
  return raw.split(",").map(function(s) { return String(s || "").trim(); }).filter(Boolean).map(function(name) {
    return { name: name, workType: "", tearUp: "None", sqft: 0 };
  });
}

function tearUpRoomsForJob(job) {
  return getRoomsForJob(job).filter(function(r) {
    return String(r.tearUp || "None").trim().toLowerCase() !== "none";
  });
}

function ventDetailLines(job) {
  var raw = String((job && job.ventsRaw) || "").trim();
  if (!raw) return [];
  return raw.split(",").map(function(s) { return String(s || "").trim(); }).filter(Boolean);
}

async function fetchWithTimeout(url, options = {}, timeoutMs = 15000) {
  return await Promise.race([
    fetch(url, options),
    new Promise((_, reject) => setTimeout(() => reject(new Error("Request timed out")), timeoutMs)),
  ]);
}

async function postAppsScriptWithRetry(payload, timeoutMs, retries = 2) {
  let lastErr = null;
  for (let attempt = 0; attempt <= retries; attempt++) {
    try {
      const res = await fetchWithTimeout(APPS_SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload || {}),
      }, timeoutMs || 30000);
      const raw = await res.text();
      let json = null;
      try { json = JSON.parse(raw); } catch (_) {}
      if (res.ok && json && json.success) return { ok: true, json, raw };
      lastErr = new Error((json && json.error) ? json.error : (raw || "Server rejected request"));
    } catch (err) {
      lastErr = err;
    }
    if (attempt < retries) {
      await new Promise((resolve) => setTimeout(resolve, (attempt + 1) * 600));
    }
  }
  return { ok: false, error: lastErr || new Error("Request failed after retries") };
}

async function downscaleImageDataUrl(dataUrl, maxDim = 1600, quality = 0.78) {
  if (!dataUrl) return dataUrl;
  return await new Promise((resolve) => {
    try {
      const img = new Image();
      img.onload = () => {
        const w = img.width || 0;
        const h = img.height || 0;
        if (!w || !h) return resolve(dataUrl);
        const scale = Math.min(1, maxDim / Math.max(w, h));
        const tw = Math.max(1, Math.round(w * scale));
        const th = Math.max(1, Math.round(h * scale));
        const canvas = document.createElement("canvas");
        canvas.width = tw;
        canvas.height = th;
        const ctx = canvas.getContext("2d");
        if (!ctx) return resolve(dataUrl);
        ctx.drawImage(img, 0, 0, tw, th);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = () => resolve(dataUrl);
      img.src = dataUrl;
    } catch {
      resolve(dataUrl);
    }
  });
}

// ── Main App ────────────────────────────────────────────────────────────────
function App() {
  const [lang, setLang] = useState(loadLang);
  const [jobs, setJobs] = useState(loadJobs);
  const [selectedJobId, setSelectedJobId] = useState(null);
  const [activeTab, setActiveTab] = useState("checklist");
  const [achievements, setAchievements] = useState(loadAchievements);
  const [showConfetti, setShowConfetti] = useState(false);
  const [loadingJobs, setLoadingJobs] = useState(false);
  const [serverError, setServerError] = useState(null);
  const [showArchived, setShowArchived] = useState(false);
  const [confirmComplete, setConfirmComplete] = useState(false);
  const [jobInfoSummaryOpen, setJobInfoSummaryOpen] = useState({});
  const [hydratingJobId, setHydratingJobId] = useState("");
  const [lastServerSyncAt, setLastServerSyncAt] = useState("");
  const hydrateAttemptRef = useRef({});
  const backgroundRefreshTimerRef = useRef(null);

  const t = T[lang];
  const selectedJob = jobs.find(j => j.id === selectedJobId);

  // Auto-save
  useEffect(() => { saveJobs(jobs); }, [jobs]);

  const fetchCrewJobs = useCallback(async (sync = false) => {
    if (!APPS_SCRIPT_URL) return;
    setLoadingJobs(true);
    setServerError(null);
    try {
      // Fast mode: manual Sync refreshes list only (calendar trigger handles background updates).
      const listTimeout = sync ? CREW_LIST_AFTER_SYNC_MS : CREW_LIST_ONLY_MS;
      const res = await fetchWithTimeout(`${APPS_SCRIPT_URL}?action=crewJobs&status=all`, { redirect: "follow" }, listTimeout);
      const json = await res.json();
      if (!json.success || !Array.isArray(json.jobs)) throw new Error(json.error || "Invalid crew jobs response");
      const normalized = json.jobs.map(j => {
        var roomsArr = Array.isArray(j.rooms) ? j.rooms : [];
        if (roomsArr.length === 0 && typeof j.roomsJson === "string" && j.roomsJson.trim()) {
          try {
            var pr = JSON.parse(j.roomsJson);
            if (Array.isArray(pr)) roomsArr = pr;
          } catch (e) {}
        }
        return {
        id: j.jobId || j.id,
        jobId: j.jobId || j.id,
        sheetId: j.sheetId || "",
        sheetUrl: j.sheetUrl || "",
        clientFolderUrl: j.clientFolderUrl || "",
        clientName: j.clientName || "Unnamed Client",
        address: j.address || "",
        phone: j.phone || "",
        jobType: j.jobType || "installation",
        sqft: Number(j.sqft || 0),
        roomsSummary: j.roomsSummary || "",
        woodSpecies: j.woodSpecies || "",
        installType: j.installType || "",
        finishType: j.finishType || "",
        stainColor: j.stainColor || "",
        product: j.product || "",
        rooms: roomsArr,
        roomsJson: typeof j.roomsJson === "string" ? j.roomsJson : "",
        ventsRaw: j.ventsRaw || "",
        reportPdfUrl: j.reportPdfUrl || "",
        checkerName: sanitizeCheckerName(j.checkerName || ""),
        summaryLines: Array.isArray(j.summaryLines) ? j.summaryLines : [],
        date: j.date || new Date().toISOString(),
        checkedItems: j.checkedItems || {},
        progress: Number(j.progress || 0),
        photos: {
          before: normalizePhotoList(j && j.photos && j.photos.before),
          after: normalizePhotoList(j && j.photos && j.photos.after),
        },
        status: j.status || "active",
      };
      });
      setJobs(normalized);
      setLastServerSyncAt(new Date().toISOString());
    } catch (err) {
      setServerError(err.message || "Could not load jobs");
    } finally {
      setLoadingJobs(false);
    }
  }, []);

  const queueBackgroundRefresh = useCallback((delayMs) => {
    if (!APPS_SCRIPT_URL) return;
    const ms = Number(delayMs) > 0 ? Number(delayMs) : 800;
    if (backgroundRefreshTimerRef.current) clearTimeout(backgroundRefreshTimerRef.current);
    backgroundRefreshTimerRef.current = setTimeout(() => {
      fetchCrewJobs(false);
    }, ms);
  }, [fetchCrewJobs]);

  // Load saved jobs only — full calendar sync runs when the user taps Sync (avoids timeout on open).
  useEffect(() => { fetchCrewJobs(false); }, [fetchCrewJobs]);

  // Keep devices in sync: refresh when tab regains focus and on a light interval.
  useEffect(() => {
    if (!APPS_SCRIPT_URL) return undefined;
    const onVisible = () => {
      if (document.visibilityState === "visible") fetchCrewJobs(false);
    };
    const onFocus = () => fetchCrewJobs(false);
    document.addEventListener("visibilitychange", onVisible);
    window.addEventListener("focus", onFocus);
    const interval = setInterval(() => {
      if (document.visibilityState === "visible") fetchCrewJobs(false);
    }, 45000);
    return () => {
      document.removeEventListener("visibilitychange", onVisible);
      window.removeEventListener("focus", onFocus);
      clearInterval(interval);
      if (backgroundRefreshTimerRef.current) clearTimeout(backgroundRefreshTimerRef.current);
    };
  }, [fetchCrewJobs]);

  useEffect(() => { setConfirmComplete(false); setJobInfoSummaryOpen({}); }, [selectedJobId]);

  useEffect(() => {
    if (!APPS_SCRIPT_URL || !selectedJob || activeTab !== "jobInfo") return;
    if (hydrateAttemptRef.current[selectedJob.id]) return;
    const rooms = getRoomsForJob(selectedJob);
    const missingRoomServiceDetails = rooms.length === 0 || rooms.every(r => !String(r.workType || "").trim());
    if (!missingRoomServiceDetails) return;
    hydrateAttemptRef.current[selectedJob.id] = true;
    setHydratingJobId(selectedJob.id);
    (async () => {
      try {
        // Fast fallback: load estimate sheet directly for this job to get room workType/tearUp.
        if (selectedJob.sheetId) {
          const resLoad = await fetchWithTimeout(
            `${APPS_SCRIPT_URL}?action=load&id=${encodeURIComponent(selectedJob.sheetId)}`,
            { redirect: "follow" },
            60000
          );
          const jLoad = await resLoad.json();
          if (jLoad && jLoad.success && jLoad.data) {
            const data = jLoad.data || {};
            const roomRows = Array.isArray(data.rooms) ? data.rooms : [];
            if (roomRows.length > 0) {
              const normalizedRooms = roomRows.map((r) => ({
                name: String(r.name || "").trim() || "Room",
                workType: String(r.workType || "").trim(),
                tearUp: String(r.tearUp || "None").trim() || "None",
                sqft: Number.parseFloat(r.sqft) || 0,
              }));
              const roomsSummary = normalizedRooms.map((r) => r.name).filter(Boolean).join(", ");
              const ventsRaw = data.extras && data.extras.vents ? String(data.extras.vents) : (selectedJob.ventsRaw || "");
              setJobs((prev) => prev.map((j) => j.id === selectedJob.id
                ? { ...j, rooms: normalizedRooms, roomsSummary, ventsRaw }
                : j
              ));
              setHydratingJobId("");
              return;
            }
          }
        }
        const res = await fetchWithTimeout(
          `${APPS_SCRIPT_URL}?action=crewHydrateJob&jobId=${encodeURIComponent(selectedJob.id)}`,
          { redirect: "follow" },
          90000
        );
        const json = await res.json();
        if (json && json.success) {
          await fetchCrewJobs(false);
        }
      } catch (_) {
        // Ignore silently; user can tap Sync to refresh list.
      } finally {
        setHydratingJobId("");
      }
    })();
  }, [APPS_SCRIPT_URL, selectedJob, activeTab, fetchCrewJobs]);

  const persistCrewJobUpdate = useCallback(async (jobId, patch) => {
    if (!APPS_SCRIPT_URL || !jobId) return;
    const result = await postAppsScriptWithRetry({
      action: "crewJobUpdate",
      jobId,
      ...patch,
    }, 35000, 2);
    if (result.ok) {
      queueBackgroundRefresh(700);
      return;
    }
    setServerError((result.error && result.error.message) ? result.error.message : "Could not save update to server");
  }, [queueBackgroundRefresh]);

  // Update a specific job
  const updateJob = (id, updates) => {
    setJobs(prev => prev.map(j => j.id === id ? { ...j, ...updates } : j));
    persistCrewJobUpdate(id, updates);
  };

  // Toggle checklist item
  const toggleCheck = (jobId, itemKey) => {
    setJobs(prev => prev.map(j => {
      if (j.id !== jobId) return j;
      let checkerName = sanitizeCheckerName(j.checkerName || "");
      if (!checkerName) {
        const entered = window.prompt(t.enterNamePrompt, "");
        if (entered === null) return j; // user cancelled prompt
        checkerName = sanitizeCheckerName(entered || "");
        if (!checkerName) return j;
      }
      const checked = { ...j.checkedItems, [itemKey]: !j.checkedItems[itemKey] };
      const list = getChecklistForJob(j);
      const doneCount = list.filter(k => checked[k]).length;
      const progress = Math.round((doneCount / list.length) * 100);

      // Check for completion confetti
      if (progress === 100 && j.progress < 100) {
        setShowConfetti(true);
        setTimeout(() => setShowConfetti(false), 2000);
      }

      persistCrewJobUpdate(j.id, { checkerName, checkedItems: checked, progress });
      return { ...j, checkerName, checkedItems: checked, progress };
    }));
  };

  const uploadPhotoToDrive = useCallback(async (job, type, photoData) => {
    if (!job || !APPS_SCRIPT_URL) return;
    const jid = job.id || job.jobId;
    try {
      const compressedDataUrl = await downscaleImageDataUrl(photoData.dataUrl);
      const result = await postAppsScriptWithRetry({
        action: "teamPhotos",
        jobId: jid,
        sheetId: job.sheetId || "",
        clientName: job.clientName,
        photos: [{
          base64: compressedDataUrl,
          type: type,
          fileName: `${type}_${Date.now()}.jpg`,
          mimeType: "image/jpeg",
        }],
      }, 70000, 2);
      const ok = !!result.ok;
      const json = ok ? result.json : null;
      const errMsg = ok ? "" : (((result.error && result.error.message) || "Upload failed"));
      setJobs(prev => prev.map(j => {
        if (j.id !== jid) return j;
        const updated = j.photos[type].map(p =>
          p.timestamp === photoData.timestamp
            ? { ...p, uploadStatus: ok ? "done" : "error", uploadError: errMsg, driveUrl: (json && json.saved && json.saved[0]) ? json.saved[0].driveUrl : undefined }
            : p
        );
        return { ...j, photos: { ...j.photos, [type]: updated } };
      }));
      if (ok) {
        queueBackgroundRefresh(900);
      } else {
        setServerError(errMsg);
      }
    } catch (err) {
      setJobs(prev => prev.map(j => {
        if (j.id !== jid) return j;
        const updated = j.photos[type].map(p =>
          p.timestamp === photoData.timestamp ? { ...p, uploadStatus: "error", uploadError: (err && err.message) ? err.message : "Network error" } : p
        );
        return { ...j, photos: { ...j.photos, [type]: updated } };
      }));
      setServerError((err && err.message) ? err.message : "Photo upload failed");
    }
  }, [queueBackgroundRefresh]);

  const addPhoto = async (job, type, photoData) => {
    if (!job) return;
    const jid = job.id || job.jobId;
    const photoWithStatus = { ...photoData, uploadStatus: "uploading" };
    setJobs(prev => prev.map(j => {
      if (j.id !== jid) return j;
      const photos = { ...j.photos, [type]: [...j.photos[type], photoWithStatus] };
      return { ...j, photos };
    }));
    await uploadPhotoToDrive(job, type, photoData);
  };

  const retryPhotoUpload = async (job, type, photoData) => {
    if (!job) return;
    const jid = job.id || job.jobId;
    setJobs(prev => prev.map(j => {
      if (j.id !== jid) return j;
      const updated = j.photos[type].map(p =>
        p.timestamp === photoData.timestamp ? { ...p, uploadStatus: "uploading" } : p
      );
      return { ...j, photos: { ...j.photos, [type]: updated } };
    }));
    await uploadPhotoToDrive(job, type, photoData);
  };

  const archiveCompletedJobs = () => {
    const completedIds = jobs.filter(j => j.status === "completed").map(j => j.id);
    if (completedIds.length === 0) return;
    setJobs(prev => prev.map(j => completedIds.indexOf(j.id) >= 0 ? { ...j, status: "archived" } : j));
    completedIds.forEach((id) => persistCrewJobUpdate(id, { status: "archived" }));
  };

  const archiveOneJob = (jobId) => {
    if (!jobId) return;
    setJobs(prev => prev.map(j => j.id === jobId ? { ...j, status: "archived" } : j));
    persistCrewJobUpdate(jobId, { status: "archived" });
  };

  // ── Job list view ─────────────────────────────────────────────────────────
  if (!selectedJob) {
    return (
      <div style={{ minHeight: "100vh", minHeight: "100dvh" }}>
        {/* Header */}
        <div style={{
          background: `linear-gradient(135deg, ${NAVY}, ${NAVY}ee)`,
          padding: "env(safe-area-inset-top, 16px) 20px 24px",
          paddingTop: "calc(env(safe-area-inset-top, 16px) + 16px)",
        }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
            <div>
              <div style={{ fontSize: 22, fontWeight: 900, color: "white" }}>{t.appTitle}</div>
              <div style={{ fontSize: 12, color: GOLD, fontWeight: 600, letterSpacing: "0.5px", marginTop: 2 }}>HARDWOOD FLOORING</div>
            </div>
            <LangToggle lang={lang} setLang={setLang} />
          </div>

          {/* Achievements row */}
          <div style={{
            display: "flex", gap: 16, overflowX: "auto", paddingBottom: 8,
            WebkitOverflowScrolling: "touch",
          }}>
            <AchievementBadge icon="🏆" label={t.achvFirstJob} unlocked={achievements.includes("firstJob")} />
            <AchievementBadge icon="📸" label={t.achvPhotoPro} unlocked={achievements.includes("photoPro")} />
            <AchievementBadge icon="🔥" label={t.achvStreak3} unlocked={achievements.includes("streak3")} />
            <AchievementBadge icon="⚡" label={t.achvStreak7} unlocked={achievements.includes("streak7")} />
            <AchievementBadge icon="💎" label={t.achvPerfect} unlocked={achievements.includes("perfect")} />
          </div>
        </div>

        {/* Jobs list */}
        <div style={{ padding: "20px 16px" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
            <div style={{ fontSize: 13, fontWeight: 700, color: "var(--gray-500)", letterSpacing: "0.6px", textTransform: "uppercase" }}>
            {t.myJobs}
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <button
                onClick={archiveCompletedJobs}
                style={{ fontSize: 11, fontWeight: 700, color: NAVY, background: "white", border: "1px solid var(--gray-300)", borderRadius: 8, padding: "6px 10px" }}>
                {t.archiveCompleted}
              </button>
              <button
                onClick={() => setShowArchived(v => !v)}
                style={{ fontSize: 11, fontWeight: 700, color: NAVY, background: "white", border: "1px solid var(--gray-300)", borderRadius: 8, padding: "6px 10px" }}>
                {showArchived ? t.hideArchived : t.showArchived}
              </button>
              <button
                onClick={() => fetchCrewJobs(true)}
                disabled={loadingJobs}
                style={{ fontSize: 11, fontWeight: 700, color: NAVY, background: "white", border: "1px solid var(--gray-300)", borderRadius: 8, padding: "6px 10px" }}>
                {loadingJobs ? "Syncing..." : "Sync"}
              </button>
            </div>
          </div>
          {serverError && (
            <div style={{ marginBottom: 10, fontSize: 12, color: "#b91c1c", background: "#fef2f2", border: "1px solid #fecaca", borderRadius: 8, padding: "8px 10px" }}>
              {serverError}
            </div>
          )}
          {lastServerSyncAt && (
            <div style={{ marginBottom: 10, fontSize: 11, color: "#475569" }}>
              Server synced: {new Date(lastServerSyncAt).toLocaleTimeString()}
            </div>
          )}
          </div>

          {jobs.filter(j => showArchived ? true : (j.status === "active" || j.status === "completed")).length === 0 ? (
            <div className="fade-in" style={{
              textAlign: "center", padding: "48px 24px", background: "white",
              borderRadius: "var(--radius)", border: "1px solid var(--gray-200)",
            }}>
              <div style={{ fontSize: 40, marginBottom: 12 }}>🏠</div>
              <div style={{ fontSize: 16, fontWeight: 600, color: "var(--gray-600)", marginBottom: 4 }}>{t.noJobs}</div>
              <div style={{ fontSize: 13, color: "var(--gray-400)" }}>{t.noJobsSub}</div>
            </div>
          ) : (
            jobs.filter(j => showArchived ? true : (j.status === "active" || j.status === "completed")).map((job, i) => {
              const isSandFinish = job.jobType === "sandFinish";
              const isInstallSf = job.jobType === "installSandFinish";
              const isInstall = !isSandFinish && !isInstallSf;
              const typeColor = isInstall ? "var(--blue)" : GOLD;
              const typeBg = isInstall ? "var(--blue-bg)" : "#fef3c7";
              const list = getChecklistForJob(job);
              const doneCount = list.filter(k => job.checkedItems[k]).length;
              const progressPct = list.length > 0 ? Math.round((doneCount / list.length) * 100) : 0;
              return (
                <div
                  key={job.id}
                  className="slide-up"
                  onClick={() => { setSelectedJobId(job.id); setActiveTab("checklist"); }}
                  style={{
                    background: "white", borderRadius: "var(--radius)", padding: "18px 16px",
                    marginBottom: 12, boxShadow: "var(--shadow)", cursor: "pointer",
                    border: "1px solid var(--gray-100)",
                    animationDelay: `${i * 60}ms`, animationFillMode: "backwards",
                  }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 10 }}>
                    <div>
                      <div style={{ fontSize: 18, fontWeight: 800, color: NAVY, marginBottom: 3 }}>{job.clientName}</div>
                      <div style={{ fontSize: 12, color: "var(--gray-500)" }}>{job.address}</div>
                    </div>
                    <div style={{
                      padding: "4px 10px", borderRadius: 8, fontSize: 11, fontWeight: 700,
                      background: typeBg, color: typeColor, whiteSpace: "nowrap",
                    }}>
                      {isInstall ? t.installation : isInstallSf ? t.installSandFinish : t.sandFinish}
                    </div>
                  </div>
                  {job.status === "completed" && (
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
                      <div style={{ fontSize: 11, fontWeight: 700, color: "#15803d" }}>{t.completed}</div>
                      <button
                        type="button"
                        onClick={(e) => { e.stopPropagation(); archiveOneJob(job.id); }}
                        style={{ fontSize: 10, fontWeight: 700, color: NAVY, background: "white", border: "1px solid var(--gray-300)", borderRadius: 7, padding: "4px 8px" }}>
                        {t.archiveNow}
                      </button>
                    </div>
                  )}
                  {job.status === "archived" && (
                    <div style={{ fontSize: 11, fontWeight: 700, color: "var(--gray-500)", marginBottom: 8 }}>{t.archived}</div>
                  )}
                  <div style={{ display: "flex", gap: 12, alignItems: "center" }}>
                    <div style={{ flex: 1, height: 6, background: "var(--gray-100)", borderRadius: 3, overflow: "hidden" }}>
                      <div style={{
                        height: "100%", borderRadius: 3, transition: "width 0.5s",
                        width: `${progressPct}%`,
                        background: `linear-gradient(90deg, ${typeColor}aa, ${typeColor})`,
                      }} />
                    </div>
                    <span style={{ fontSize: 12, fontWeight: 700, color: typeColor, minWidth: 32, textAlign: "right" }}>
                      {doneCount}/{list.length}
                    </span>
                  </div>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10, marginTop: 10 }}>
                    <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
                      <span style={{ fontSize: 11, color: "var(--gray-400)" }}>📐 {job.sqft} {t.sqft}</span>
                      <span style={{ fontSize: 11, color: "var(--gray-400)" }}>🪵 {job.woodSpecies}</span>
                      <span style={{ fontSize: 11, color: "var(--gray-400)" }}>📅 {new Date(job.date).toLocaleDateString()}</span>
                    </div>
                    <button
                      type="button"
                      onClick={(e) => { e.stopPropagation(); setSelectedJobId(job.id); setActiveTab("photos"); }}
                      style={{
                        fontSize: 10,
                        fontWeight: 700,
                        color: NAVY,
                        background: "white",
                        border: "1px solid var(--gray-300)",
                        borderRadius: 8,
                        padding: "6px 9px",
                        whiteSpace: "nowrap",
                      }}
                    >
                      📷 {t.retrievePic}
                    </button>
                  </div>
                </div>
              );
            })
          )}
        </div>
    );
  }

  // ── Job detail view ───────────────────────────────────────────────────────
  const isSandFinish = selectedJob.jobType === "sandFinish";
  const isInstallSf = selectedJob.jobType === "installSandFinish";
  const isInstall = !isSandFinish && !isInstallSf;
  const checklist = getChecklistForJob(selectedJob);
  const typeColor = isInstall ? "var(--blue)" : GOLD;
  const doneCount = checklist.filter(k => selectedJob.checkedItems[k]).length;

  return (
    <div style={{ minHeight: "100vh", minHeight: "100dvh", paddingBottom: 80 }}>
      {/* Confetti burst */}
      {showConfetti && (
        <div style={{ position: "fixed", top: 0, left: 0, right: 0, bottom: 0, pointerEvents: "none", zIndex: 999 }}>
          {Array.from({ length: 30 }).map((_, i) => (
            <div key={i} style={{
              position: "absolute",
              left: `${Math.random() * 100}%`, top: `${40 + Math.random() * 30}%`,
              fontSize: 20, animation: `confetti ${1 + Math.random()}s ease-out forwards`,
              animationDelay: `${Math.random() * 0.5}s`,
            }}>
              {["🎉", "⭐", "🔥", "💪", "🏆", "✨"][Math.floor(Math.random() * 6)]}
            </div>
          ))}
        </div>
      )}

      {/* Header */}
      <div style={{
        background: `linear-gradient(135deg, ${NAVY}, ${NAVY}ee)`,
        padding: "env(safe-area-inset-top, 12px) 16px 14px",
        paddingTop: "calc(env(safe-area-inset-top, 12px) + 12px)",
      }}>
        <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 10 }}>
          <button onClick={() => setSelectedJobId(null)} style={{
            background: "rgba(255,255,255,0.15)", borderRadius: 10, padding: "8px 14px",
            color: "white", fontSize: 13, fontWeight: 600,
          }}>
            ← {t.back}
          </button>
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: 17, fontWeight: 800, color: "white", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
              {selectedJob.clientName}
            </div>
            <div style={{ fontSize: 11, color: GOLD, fontWeight: 600 }}>
              {isInstall ? t.installation : isInstallSf ? t.installSandFinish : t.sandFinish} • {selectedJob.sqft} {t.sqft}
            </div>
          </div>
          <LangToggle lang={lang} setLang={setLang} />
        </div>

        {/* Compact progress */}
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <div style={{ flex: 1, height: 6, background: "rgba(255,255,255,0.15)", borderRadius: 3 }}>
            <div style={{
              height: "100%", borderRadius: 3, transition: "width 0.3s",
              width: `${selectedJob.progress}%`,
              background: `linear-gradient(90deg, var(--green), #4ade80)`,
            }} />
          </div>
          <span style={{ fontSize: 14, fontWeight: 800, color: "white" }}>{selectedJob.progress}%</span>
        </div>
      </div>

      {/* Tab bar */}
      <div style={{
        display: "flex", background: "white", borderBottom: "1px solid var(--gray-200)",
        position: "sticky", top: 0, zIndex: 10,
      }}>
        {["checklist", "jobInfo", "photos"].map(tab => (
          <button
            key={tab}
            onClick={() => setActiveTab(tab)}
            style={{
              flex: 1, padding: "12px 8px", fontSize: 12, fontWeight: 700,
              color: activeTab === tab ? NAVY : "var(--gray-400)",
              background: "transparent",
              borderBottom: activeTab === tab ? `3px solid ${NAVY}` : "3px solid transparent",
              textTransform: "uppercase", letterSpacing: "0.5px",
              transition: "all 0.2s",
            }}>
            {tab === "checklist" ? `✓ ${t.checklist}` : tab === "jobInfo" ? `📋 ${t.jobInfo}` : `📷 ${t.photos}`}
          </button>
        ))}
      </div>

      {/* Content */}
      <div className="fade-in" style={{ padding: "16px" }}>

        {/* ── Checklist Tab ── */}
        {activeTab === "checklist" && (
          <div>
            {selectedJob.status !== "completed" && selectedJob.status !== "archived" && (
              <ProgressSlider
                value={selectedJob.progress}
                onChange={v => updateJob(selectedJob.id, { progress: v })}
                t={t}
              />
            )}
            {selectedJob.status !== "completed" && selectedJob.status !== "archived" && !confirmComplete && (
              <button
                type="button"
                onClick={() => setConfirmComplete(true)}
                style={{
                  width: "100%",
                  background: "#16a34a",
                  color: "white",
                  borderRadius: 10,
                  padding: "12px 16px",
                  fontSize: 14,
                  fontWeight: 800,
                  marginBottom: 10,
                }}>
                {t.markComplete}
              </button>
            )}
            {selectedJob.status !== "completed" && selectedJob.status !== "archived" && confirmComplete && (
              <div style={{ marginBottom: 12, padding: 14, background: "var(--gray-50)", borderRadius: 10, border: "1px solid var(--gray-200)" }}>
                <div style={{ fontSize: 14, fontWeight: 600, color: "var(--gray-700)", marginBottom: 10 }}>{t.confirmMarkComplete}</div>
                <div style={{ display: "flex", gap: 8 }}>
                  <button
                    type="button"
                    onClick={() => {
                      updateJob(selectedJob.id, { status: "completed", progress: 100 });
                      setConfirmComplete(false);
                    }}
                    style={{
                      flex: 1,
                      background: "#16a34a",
                      color: "white",
                      borderRadius: 10,
                      padding: "12px 8px",
                      fontSize: 14,
                      fontWeight: 800,
                    }}>
                    {t.yesComplete}
                  </button>
                  <button
                    type="button"
                    onClick={() => setConfirmComplete(false)}
                    style={{
                      flex: 1,
                      background: "white",
                      color: NAVY,
                      borderRadius: 10,
                      padding: "12px 8px",
                      fontSize: 14,
                      fontWeight: 700,
                      border: "1px solid var(--gray-300)",
                    }}>
                    {t.cancel}
                  </button>
                </div>
              </div>
            )}
            {selectedJob.status === "completed" && (
              <button
                type="button"
                onClick={() => updateJob(selectedJob.id, { status: "active", progress: Math.min(99, selectedJob.progress) })}
                style={{
                  width: "100%",
                  background: "white",
                  color: NAVY,
                  borderRadius: 10,
                  padding: "12px 16px",
                  fontSize: 14,
                  fontWeight: 700,
                  marginBottom: 10,
                  border: "1px solid var(--gray-300)",
                }}>
                {t.undoComplete}
              </button>
            )}
            <div style={{ fontSize: 13, fontWeight: 700, color: "var(--gray-500)", marginBottom: 10, textTransform: "uppercase", letterSpacing: "0.5px" }}>
              {t.checklist} — {doneCount}/{checklist.length}
            </div>
            {selectedJob.checkerName && (
              <div style={{ fontSize: 12, fontWeight: 600, color: "var(--gray-600)", marginBottom: 10 }}>
                {t.checkedBy}: {selectedJob.checkerName}
              </div>
            )}
            {checklist.map((key, i) => (
              <CheckItem
                key={key}
                label={getChecklistItemLabel(selectedJob, key, t)}
                checked={!!selectedJob.checkedItems[key]}
                onToggle={() => toggleCheck(selectedJob.id, key)}
                index={i}
              />
            ))}
          </div>
        )}

        {/* ── Job Info Tab (Tear Sheet) ── */}
        {activeTab === "jobInfo" && (
          <div>
            {/* Customer card */}
            <div style={{
              background: "white", borderRadius: "var(--radius)", padding: 18,
              border: "1px solid var(--gray-200)", marginBottom: 12, boxShadow: "var(--shadow)",
            }}>
              <div style={{ fontSize: 11, fontWeight: 700, color: "var(--gray-400)", textTransform: "uppercase", letterSpacing: "0.5px", marginBottom: 10 }}>
                {t.customer}
              </div>
              <div style={{ fontSize: 18, fontWeight: 800, color: NAVY, marginBottom: 6 }}>{selectedJob.clientName}</div>
              <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 4 }}>
                <span style={{ fontSize: 14 }}>📍</span>
                <span style={{ fontSize: 14, color: "var(--gray-600)" }}>{displayOrDash(selectedJob.address, t)}</span>
              </div>
              {selectedJob.phone && (
                <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  <span style={{ fontSize: 14 }}>📞</span>
                  <a href={`tel:${selectedJob.phone}`} style={{ fontSize: 14, color: "var(--blue)", fontWeight: 600, textDecoration: "none" }}>
                    {selectedJob.phone}
                  </a>
                </div>
              )}
            </div>

            {selectedJob.summaryLines && selectedJob.summaryLines.length > 0 && (
              <div style={{
                background: "white", borderRadius: "var(--radius)", padding: 18,
                border: "1px solid var(--gray-200)", marginBottom: 12, boxShadow: "var(--shadow)",
              }}>
                <div style={{ fontWeight: 800, fontSize: 16, color: NAVY, marginBottom: 4 }}>{t.qbLineItems}</div>
                <div style={{ fontSize: 12, color: "#888", marginBottom: 14 }}>{t.qbLineItemsSub}</div>
                {hydratingJobId === selectedJob.id && (
                  <div style={{ fontSize: 12, color: "#666", marginBottom: 10 }}>Refreshing room details...</div>
                )}
                {normalizeSummaryLinesForCrew(selectedJob.summaryLines).map((line, i, arr) => {
                  const lab = String(line.label || "").trim();
                  const sumKey = "sl-" + i + "-" + lab.replace(/\s+/g, "-");
                  const open = !!jobInfoSummaryOpen[sumKey];
                  const rooms = getRoomsForJob(selectedJob);
                  const tearUps = tearUpRoomsForJob(selectedJob);
                  const ventLines = ventDetailLines(selectedJob);
                  const qtyNum = line.qty !== null && line.qty !== undefined ? Number(line.qty) : 0;

                  const showRoomMenu = lab === "Total Project Sq Ft";
                  const tearDisplayList = tearUps.length > 0 ? tearUps : rooms;
                  const showTearMenu = lab === "Tear-Up" && (qtyNum > 0 || rooms.length > 0);
                  const showVentMenu = lab === "Vents";

                  const roomNamesOnly = rooms.length > 0 && rooms.every(function(r) { return !String(r.workType || "").trim(); });

                  const toggleBtn = {
                    width: "100%",
                    textAlign: "left",
                    marginTop: 8,
                    padding: "12px 14px",
                    borderRadius: 10,
                    border: "1px solid var(--gray-200)",
                    background: "var(--gray-50)",
                    fontSize: 14,
                    fontWeight: 700,
                    color: NAVY,
                    display: "flex",
                    alignItems: "center",
                    justifyContent: "space-between",
                    gap: 8,
                    cursor: "pointer",
                    WebkitTapHighlightColor: "transparent",
                  };

                  return (
                  <div key={i} style={{ borderBottom: i < arr.length - 1 ? "1px solid #f0f0f0" : "none", paddingBottom: 12, marginBottom: 12 }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 8 }}>
                      <div style={{ fontWeight: 700, color: NAVY, fontSize: 14, flex: 1 }}>{line.label}</div>
                      {line.qty !== null && line.qty !== undefined && (
                        <div style={{ fontWeight: 700, color: ORANGE, fontSize: 14, whiteSpace: "nowrap" }}>{line.qty} {line.unit}</div>
                      )}
                    </div>

                    {showRoomMenu ? (
                      <div>
                        <button
                          type="button"
                          onClick={() => setJobInfoSummaryOpen(function(prev) { return Object.assign({}, prev, { [sumKey]: !prev[sumKey] }); })}
                          style={toggleBtn}
                          aria-expanded={open}
                        >
                          <span>{line.desc || t.tapRoomList}</span>
                          <span style={{ fontSize: 12, color: "var(--gray-500)" }}>{open ? "▲" : "▼"}</span>
                        </button>
                        {open && (
                          <div style={{ marginTop: 10, padding: 12, background: "white", borderRadius: 10, border: "1px solid var(--gray-200)" }}>
                            {rooms.length === 0 ? (
                              <div style={{ fontSize: 12, color: "var(--gray-600)", lineHeight: 1.5 }}>{t.roomsEmptyHint}</div>
                            ) : (
                              <div>
                                {roomNamesOnly && (
                                  <div style={{ fontSize: 11, color: "#b45309", marginBottom: 10, lineHeight: 1.4 }}>{t.roomListPartial}</div>
                                )}
                                {rooms.map(function(r, ri) {
                                  return (
                                    <div key={ri} style={{ padding: "10px 0", borderBottom: ri < rooms.length - 1 ? "1px solid var(--gray-100)" : "none" }}>
                                      <div style={{ fontWeight: 800, fontSize: 14, color: NAVY }}>{r.name}</div>
                                      <div style={{ fontSize: 12, color: "var(--gray-600)", marginTop: 4 }}>
                                        <span style={{ fontWeight: 700 }}>{t.workTypeShort}:</span>{" "}
                                        {String(r.workType || "").trim() ? r.workType : t.notAvailable}
                                      </div>
                                  <div style={{ fontSize: 12, color: "var(--gray-600)", marginTop: 2 }}>
                                    <span style={{ fontWeight: 700 }}>{t.tearUpShort}:</span>{" "}
                                    {(() => {
                                      var tu = String(r.tearUp || "").trim();
                                      if (!tu || tu.toLowerCase() === "none") return "None";
                                      return tu;
                                    })()}
                                  </div>
                                      {r.sqft > 0 && (
                                        <div style={{ fontSize: 12, color: ORANGE, marginTop: 2, fontWeight: 600 }}>{r.sqft} {t.sqft}</div>
                                      )}
                                    </div>
                                  );
                                })}
                              </div>
                            )}
                          </div>
                        )}
                      </div>
                    ) : (
                      <div style={{ fontSize: 12, color: "#666", marginTop: 3, lineHeight: 1.4 }}>{line.desc}</div>
                    )}

                    {showTearMenu && (
                      <div style={{ marginTop: showRoomMenu ? 10 : 8 }}>
                        <button
                          type="button"
                          onClick={() => setJobInfoSummaryOpen(function(prev) { var k = sumKey + "-tear"; return Object.assign({}, prev, { [k]: !prev[k] }); })}
                          style={toggleBtn}
                          aria-expanded={!!jobInfoSummaryOpen[sumKey + "-tear"]}
                        >
                          <span>{t.tapTearUpList}</span>
                          <span style={{ fontSize: 12, color: "var(--gray-500)" }}>{jobInfoSummaryOpen[sumKey + "-tear"] ? "▲" : "▼"}</span>
                        </button>
                        {jobInfoSummaryOpen[sumKey + "-tear"] && (
                          <div style={{ marginTop: 10, padding: 12, background: "white", borderRadius: 10, border: "1px solid var(--gray-200)" }}>
                            {tearDisplayList.length === 0 ? (
                              <div style={{ fontSize: 12, color: "var(--gray-600)", lineHeight: 1.5 }}>{t.roomsEmptyHint}</div>
                            ) : (
                              tearDisplayList.map(function(r, ti) {
                                return (
                                  <div key={ti} style={{ padding: "10px 0", borderBottom: ti < tearDisplayList.length - 1 ? "1px solid var(--gray-100)" : "none" }}>
                                    <div style={{ fontWeight: 800, fontSize: 14, color: NAVY }}>{r.name}</div>
                                    <div style={{ fontSize: 12, color: "var(--gray-600)", marginTop: 4 }}>
                                      <span style={{ fontWeight: 700 }}>{t.tearUpShort}:</span>{" "}
                                      {(() => {
                                        var tu = String(r.tearUp || "").trim();
                                        if (!tu || tu.toLowerCase() === "none") return "None";
                                        return tu;
                                      })()}
                                    </div>
                                    {r.sqft > 0 && (
                                      <div style={{ fontSize: 12, color: ORANGE, marginTop: 2, fontWeight: 600 }}>{r.sqft} {t.sqft}</div>
                                    )}
                                  </div>
                                );
                              })
                            )}
                          </div>
                        )}
                      </div>
                    )}

                    {showVentMenu && (
                      <div style={{ marginTop: 8 }}>
                        <button
                          type="button"
                          onClick={() => setJobInfoSummaryOpen(function(prev) { var k = sumKey + "-vent"; return Object.assign({}, prev, { [k]: !prev[k] }); })}
                          style={toggleBtn}
                          aria-expanded={!!jobInfoSummaryOpen[sumKey + "-vent"]}
                        >
                          <span>{t.tapVentList}</span>
                          <span style={{ fontSize: 12, color: "var(--gray-500)" }}>{jobInfoSummaryOpen[sumKey + "-vent"] ? "▲" : "▼"}</span>
                        </button>
                        {jobInfoSummaryOpen[sumKey + "-vent"] && (
                          <div style={{ marginTop: 10, padding: 12, background: "white", borderRadius: 10, border: "1px solid var(--gray-200)", fontSize: 12, color: "var(--gray-700)", lineHeight: 1.5 }}>
                            {ventLines.length === 0 ? (
                              <span>{line.desc}</span>
                            ) : (
                              <ul style={{ margin: 0, paddingLeft: 18 }}>
                                {ventLines.map(function(v, vi) { return <li key={vi}>{v}</li>; })}
                              </ul>
                            )}
                          </div>
                        )}
                      </div>
                    )}
                  </div>
                )})}
              </div>
            )}

            {/* Job details / links (fallback when no QB lines; or links only when QB lines present) */}
            <div style={{
              background: "white", borderRadius: "var(--radius)", padding: 18,
              border: "1px solid var(--gray-200)", boxShadow: "var(--shadow)",
            }}>
              <div style={{ fontSize: 11, fontWeight: 700, color: "var(--gray-400)", textTransform: "uppercase", letterSpacing: "0.5px", marginBottom: 12 }}>
                {t.jobInfo}
              </div>
              {(selectedJob.summaryLines && selectedJob.summaryLines.length > 0
                ? buildTearSheetLinkRows(selectedJob, t)
                : buildTearSheetRows(selectedJob, t)
              ).map(([label, value], i, arr) => (
                <div key={i} style={{
                  display: "flex", justifyContent: "space-between", padding: "10px 0",
                  borderBottom: i < arr.length - 1 ? "1px solid var(--gray-100)" : "none",
                }}>
                  <span style={{ fontSize: 13, color: "var(--gray-500)", fontWeight: 500 }}>{label}</span>
                  <span style={{ fontSize: 14, fontWeight: 700, color: NAVY, textAlign: "right", maxWidth: "60%" }}>{value}</span>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* ── Photos Tab ── */}
        {activeTab === "photos" && (
          <div>
            <PhotoSection
              title={t.beforePhotos}
              photos={selectedJob.photos.before}
              onAdd={photo => addPhoto(selectedJob, "before", photo)}
              onRetryPhoto={photo => retryPhotoUpload(selectedJob, "before", photo)}
              retryLabel={t.retryUpload}
              addLabel={t.addPhotos}
            />
            <PhotoSection
              title={t.afterPhotos}
              photos={selectedJob.photos.after}
              onAdd={photo => addPhoto(selectedJob, "after", photo)}
              onRetryPhoto={photo => retryPhotoUpload(selectedJob, "after", photo)}
              retryLabel={t.retryUpload}
              addLabel={t.addPhotos}
            />
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
